        <meta name="twitter:image" content="https://tao-boy.github.io/xray-config-ui-editor/favicon.svg">

        <!-- Schema.org JSON-LD Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Xray 配置编辑器",
            "url": "https://tao-boy.github.io/xray-config-ui-editor/",

            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "All",
            "inLanguage": "zh-CN",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            },
            "author": {
                "@type": "Person",
                "name": "bropines"
            }
        }
        </script>

        <!-- Favicon -->
        <!-- The site is served from a project subpath, so a root-relative
             icon href resolved to the wrong origin path. Vite rewrites these
             against `base`. -->
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="48x48" />
        <!-- iOS has no manifest icon support worth relying on, and no
             beforeinstallprompt: the home-screen icon comes from here. -->
        <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
        <meta name="theme-color" content="#020617" />
        <!-- `apple-mobile-web-app-capable` is deprecated and warns in Chrome;
             the status bar style has no manifest equivalent, so it stays. -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Xray 编辑器" />

        <!-- One request, not two: the same families were requested twice, once
             with display=block (invisible text for up to 3s) and once with
             display=swap, which doubled every @font-face. Cyrillic subsets are
             warmed from src/i18n so CodeMirror measures a real glyph width. -->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap">

        <!-- Tailwind is now compiled at build time via @tailwindcss/vite
             (see vite.config.ts + src/index.css, imported from src/main.tsx),
             not the runtime CDN script this used to load here. -->
    </head>

    <body>
        <div id="app">
            <!-- SEO Fallback Content for Crawlers and Bots (replaced on React mount) -->
            <noscript>
                <div style="padding: 2rem; max-width: 800px; margin: 0 auto; color: #fff;">
                    <h1>Xray 配置编辑器</h1>
                    <p>Xray-core 可视化配置编辑器，支持入站、出站、路由、REALITY 和 Remnawave。请启用 JavaScript 以运行此应用。</p>
                </div>
            </noscript>
            <div style="padding: 2rem; max-width: 800px; margin: 0 auto;">
                <h1 class="text-2xl font-bold text-white mb-2">Xray 配置编辑器 — Xray-core 可视化工具</h1>
                <p class="text-slate-300 mb-4">在浏览器中创建、编辑、查看和管理 Xray-core 配置的静态网页工具。</p>
                <h2 class="text-lg font-semibold text-slate-200 mb-2">主要功能：</h2>
                <ul class="list-disc list-inside text-slate-400 space-y-1">
                    <li>完整配置管理：入站、出站、路由、DNS、策略、反向代理和统计。</li>
                    <li>通过 API 直接同步 Remnawave 面板。</li>
                    <li>基于 React Flow 的交互式流量拓扑。</li>
                    <li>内置 VLESS REALITY 密钥对生成器（X25519）。</li>
                    <li>支持拖动排序的路由规则管理器。</li>
                    <li>双模式编辑：图形表单与支持语法检查的原始 JSON 编辑器。</li>
                </ul>
                <p class="text-slate-500 mt-4 text-xs">正在加载应用…</p>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>

</html>
